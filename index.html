<!DOCTYPE html>
<html lang="en" class="bg-slate-950">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leilon Alchemy Engine</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  body { font-family: Inter, sans-serif; }
  h1, h2, h3, .ser { font-family: Cinzel, serif; }
  @keyframes dice-spin { 0% { transform: rotate(0deg) scale(0.8); } 50% { transform: rotate(180deg) scale(1.2); } 100% { transform: rotate(360deg) scale(1); } }
  .animate-dice { animation: dice-spin 0.6s ease-in-out infinite; }
</style>
</head>
<body class="text-slate-200 min-h-screen">
<header class="bg-slate-900/80 border-b border-slate-800 sticky top-0 z-10">
  <div class="max-w-5xl mx-auto px-4 h-14 flex items-center justify-between">
    <h1 class="font-bold text-amber-100 tracking-wide"><i class="fa-solid fa-flask-vial text-amber-400 mr-2"></i>LEILON ALCHEMY ENGINE</h1>
    <div id="who" class="text-xs text-slate-400"></div>
  </div>
</header>
<main id="app" class="max-w-5xl mx-auto px-4 py-6"></main>

<script>
const SUPABASE_URL = "https://ratnpbutyevultkjlfxw.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_15LGzTrmo_CmKNR3gbgHDQ_GUWwHLvP";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn = 'px-3 py-1.5 rounded-lg bg-amber-500 text-slate-950 font-semibold text-sm hover:bg-amber-400';
const btn2 = 'px-3 py-1.5 rounded-lg border border-slate-700 text-slate-300 text-sm hover:border-amber-500';
const inp = 'bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm w-full focus:outline-none focus:border-amber-500';
const card = 'bg-slate-900/60 border border-slate-800 rounded-2xl p-4';
const render = h => { $('#app').innerHTML = h; };
const fail = e => alert(e && e.message ? e.message : e);
let sb, ING = [], EFF = {}, P = null, creds = null, dm = {};

if (SUPABASE_URL.startsWith('PASTE')) {
  render(`<div class="${card}">Open <code>index.html</code> and paste your Supabase URL and anon key.</div>`);
} else {
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  boot();
}

async function boot() {
  const { data } = await sb.auth.getSession();
  if (data.session) return dmHome();
  try { const c = JSON.parse(sessionStorage.getItem('pc')); if (c) { creds = c; return playerRefresh(); } } catch (e) {}
  loginView('player');
}

// ================= LOGIN =================
function loginView(tab) {
  const tabBtn = (t, l) => `<button onclick="loginView('${t}')" class="${t===tab?btn:btn2} flex-1">${l}</button>`;
  render(`<div class="${card} max-w-sm mx-auto space-y-3">
    <div class="flex gap-2">${tabBtn('player','Player')}${tabBtn('dm','Dungeon Master')}</div>${tab==='player' ? `
      <input id="u" class="${inp}" placeholder="Username" autocomplete="username">
      <input id="p" type="password" class="${inp}" placeholder="Campaign password" autocomplete="current-password">
      <button onclick="playerLogin()" class="${btn} w-full">Enter Laboratory</button>` : `
      <input id="e" type="email" class="${inp}" placeholder="DM email">
      <input id="p" type="password" class="${inp}" placeholder="Password">
      <div class="flex gap-2"><button onclick="dmLogin()" class="${btn} flex-1">Sign in</button><button onclick="dmSignup()" class="${btn2} flex-1">Create DM account</button></div>`}
  </div>`);
}
async function dmLogin() { const { error } = await sb.auth.signInWithPassword({ email: $('#e').value, password: $('#p').value }); error ? fail(error) : dmHome(); }
async function dmSignup() { const { error } = await sb.auth.signUp({ email: $('#e').value, password: $('#p').value }); error ? fail(error) : alert('Account created.'); }
async function logout() { if (!creds) await sb.auth.signOut(); sessionStorage.removeItem('pc'); creds = null; $('#who').textContent = ''; loginView('player'); }

// ================= DM SIDE =================
async function dmHome(tab) {
  $('#who').innerHTML = `DM <button onclick="logout()" class="ml-2 underline">Log out</button>`;
  if (!ING.length) {
    const { data } = await sb.from('ingredients').select('id,data');
    ING = (data || []).map(r => r.data).sort((a,b) => a.name.localeCompare(b.name));
  }
  const { data: cs, error } = await sb.from('campaigns').select('id,name').order('created_at');
  if (error) return fail(error);

  render(`<h2 class="text-xl text-amber-200 mb-3">Your Campaigns (${cs.length}/5)</h2>
    <div class="grid sm:grid-cols-2 gap-3 mb-6">${cs.map(c => `<button onclick="selectDmCampaign('${c.id}')" class="${card} text-left hover:border-amber-500 flex justify-between items-center">
      <div><div class="font-bold text-amber-200">${esc(c.name)}</div><div class="text-xs text-slate-500">ID: ${c.id.substring(0,8)}...</div></div>
      <i class="fa-solid fa-chevron-right text-slate-600"></i>
    </button>`).join('')}</div>`);
}

async function selectDmCampaign(cid) {
  dm.cid = cid;
  openCampaign(cid);
}

async function openCampaign(id) {
  dm.cid = id;
  const [{ data: c }, { data: ps }, { data: logs }] = await Promise.all([
    sb.from('campaigns').select('id, name, password').eq('id', id).single(),
    sb.from('players').select('*').eq('campaign_id', id).order('username'),
    sb.from('activity_logs').select('*').eq('campaign_id', id).order('created_at', { ascending: false })
  ]);
  
  render(`<button onclick="dmHome()" class="${btn2} mb-3"><i class="fa-solid fa-arrow-left"></i> Campaigns Overview</button>
    <div class="flex justify-between items-center mb-3">
      <h2 class="text-xl text-amber-200">${esc(c.name)} Dashboard</h2>
    </div>
    
    <div class="grid md:grid-cols-2 gap-4">
      <div class="${card} space-y-3">
        <h3 class="text-sm font-bold text-amber-300 border-b border-slate-800 pb-2"><i class="fa-solid fa-users mr-1"></i> Campaign Players (${(ps||[]).length})</h3>
        <div class="space-y-2 max-h-[300px] overflow-y-auto">
          ${(ps||[]).map(p => `<div class="p-2 bg-slate-950 rounded border border-slate-800 flex justify-between items-center text-xs">
            <span class="font-bold text-amber-200">${esc(p.username)}</span>
            <span class="text-slate-400">Skill: ${esc(p.foraging_skill || 'nature')} (+${p.foraging_bonus || 0})</span>
          </div>`).join('')}
        </div>
      </div>

      <div class="${card} space-y-2 max-h-[400px] overflow-y-auto">
        <h3 class="text-sm font-bold text-amber-300 border-b border-slate-800 pb-2"><i class="fa-solid fa-scroll mr-1"></i> Live Activity Logs</h3>
        ${(logs && logs.length) ? logs.map(l => `<div class="p-2 bg-slate-950 rounded border border-slate-800 text-xs">
          <span class="font-bold text-amber-200">${esc(l.username)}:</span> ${esc(l.details)}
        </div>`).join('') : '<p class="text-xs text-slate-500">No activity logged yet.</p>'}
      </div>
    </div>`);
}

// ================= PLAYER SIDE =================
async function playerLogin() { creds = { u: $('#u').value.trim(), p: $('#p').value }; await playerRefresh(true); }
async function playerRefresh(fromLogin) {
  const { data, error } = await sb.rpc('p_state', { uname: creds.u, pass: creds.p });
  if (error) return fail(error);
  if (!data) return loginView('player');
  try { sessionStorage.setItem('pc', JSON.stringify(creds)); } catch (e) {}
  P = data; $('#who').innerHTML = `${esc(P.username)} ·${esc(P.campaign)} <button onclick="logout()" class="ml-2 underline">Log out</button>`;
  playerView(window.ptab || 'lib');
}

function playerView(tab) {
  window.ptab = tab;
  const t = (k, l) => `<button onclick="playerView('${k}')" class="${tab === k ? btn : btn2}">${l}</button>`;
  render(`<div class="flex items-center justify-between mb-5">
    <div class="flex gap-2">${t('brew', 'Brewing Station')}${t('lib', 'My Reagents')}${t('pot', 'Potions')}</div>
    <div>${t('options', 'Options')}</div>
  </div><div id="pv"></div>`);
  tab === 'lib' ? libView() : tab === 'options' ? optionsView() : tab === 'pot' ? potView() : brewView();
}

function libView() {
  const biomes = [...new Set(P.ingredients.map(i => i.biome).filter(Boolean))];
  $('#pv').innerHTML = `
    <div class="mb-4 flex flex-wrap gap-2 justify-between items-center bg-slate-900/80 p-3 rounded-xl border border-slate-800">
      <select id="p_bio" class="${inp} max-w-xs" onchange="drawPlayerLib()"><option value="">All Biomes</option>${biomes.map(b=>`<option value="${esc(b)}">${esc(b)}</option>`).join('')}</select>
      <button onclick="openAddReagentModal()" class="${btn}"><i class="fa-solid fa-plus-circle mr-1"></i> Click here to add more</button>
    </div>
    <div id="p_lib_list" class="grid md:grid-cols-2 gap-3"></div>
    <div id="add_modal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4"></div>
  `;
  drawPlayerLib();
}

function drawPlayerLib() {
  const b = $('#p_bio').value;
  const filtered = P.ingredients.filter(i => !b || i.biome === b);
  $('#p_lib_list').innerHTML = filtered.map(i => `<div class="${card} relative">
    <div class="font-semibold text-amber-200 flex justify-between items-start">
      <span><i class="fa-solid ${esc(i.icon)} mr-2"></i>${esc(i.name)}</span>
      <button onclick="editQtyPrompt('${i.id}',${i.qty || 0})" class="text-xs text-emerald-400 hover:underline font-bold">
        (Click to edit) In Stock: ${i.qty || 0}
      </button>
    </div>
    <div class="text-xs text-slate-400 mb-2">${esc(i.biome)} — ${esc(i.location)}</div>${i.traits.map(t => t.name ? `<div class="text-sm"><span class="text-amber-300">${t.i + 1}.${esc(t.name)}</span> <span class="text-slate-400">${esc(t.desc)}</span></div>` : `<div class="text-sm text-slate-600">${t.i + 1}. ???</div>`).join('')}
    
    <div class="mt-3 pt-3 border-t border-slate-800/80 flex gap-2">
      <button onclick="forageInteractive('${i.id}')" class="${btn} text-xs flex-1"><i class="fa-solid fa-seedling mr-1"></i> Forage For More</button>
    </div>
  </div>`).join('');
}

function openAddReagentModal() {
  const modal = $('#add_modal');
  modal.classList.remove('hidden');
  const knownIds = new Set(P.ingredients.map(x => x.id));
  const unlearned = (P.all_ingredients || []).filter(x => !knownIds.has(x.id));

  modal.innerHTML = `<div class="${card} max-w-lg w-full max-h-[80vh] flex flex-col space-y-3">
    <div class="flex justify-between items-center border-b border-slate-800 pb-2">
      <h3 class="text-base font-bold text-amber-300"><i class="fa-solid fa-book-open mr-2"></i>Discover / Add Reagents</h3>
      <button onclick="$('#add_modal').classList.add('hidden')" class="text-slate-400 hover:text-slate-200"><i class="fa-solid fa-xmark text-lg"></i></button>
    </div>
    <input id="mod_search" class="${inp}" placeholder="Search all regional flora..." oninput="filterModalReagents()">
    <div id="mod_list" class="space-y-2 overflow-y-auto flex-1 pr-1"></div>
  </div>`;
  filterModalReagents();
}

function filterModalReagents() {
  const q = ($('#mod_search').value || '').toLowerCase();
  const knownIds = new Set(P.ingredients.map(x => x.id));
  const unlearned = (P.all_ingredients || []).filter(x => (!knownIds.has(x.id)) && (!q || x.name.toLowerCase().includes(q) || (x.biome && x.biome.toLowerCase().includes(q))));

  $('#mod_list').innerHTML = !unlearned.length ? `<p class="text-xs text-slate-500 py-4 text-center">No unlearned reagents found matching search.</p>`
    : unlearned.map(i => `<div class="p-3 bg-slate-950 rounded-xl border border-slate-800 flex justify-between items-center">
      <div>
        <div class="font-bold text-amber-200 text-sm"><i class="fa-solid ${esc(i.icon)} mr-1"></i>${esc(i.name)}</div>
        <div class="text-[10px] text-slate-400">${esc(i.biome)} · Base Value: ${i.value || 1}gp</div>
      </div>
      <button onclick="promptAcquireChoice('${i.id}', '${esc(i.name)}')" class="${btn} text-xs">Add Reagent</button>
    </div>`).join('');
}

function promptAcquireChoice(iid, ingName) {
  $('#add_modal').classList.add('hidden');
  render(`<div class="${card} max-w-md mx-auto text-center space-y-4">
    <h3 class="text-lg text-amber-20
