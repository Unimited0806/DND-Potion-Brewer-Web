<!DOCTYPE html>
<html lang="en" class="bg-slate-950">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leilon Alchemy Engine</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  body { font-family: Inter, sans-serif; }
  h1, h2, h3, .ser { font-family: Cinzel, serif; }
  @keyframes dice-spin { 0% { transform: rotate(0deg) scale(0.8); } 50% { transform: rotate(180deg) scale(1.2); } 100% { transform: rotate(360deg) scale(1); } }
  .animate-dice { animation: dice-spin 0.6s ease-in-out infinite; }
</style>
</head>
<body class="text-slate-200 min-h-screen">
<header class="bg-slate-900/80 border-b border-slate-800 sticky top-0 z-10">
  <div class="max-w-5xl mx-auto px-4 h-14 flex items-center justify-between">
    <h1 class="font-bold text-amber-100 tracking-wide"><i class="fa-solid fa-flask-vial text-amber-400 mr-2"></i>LEILON ALCHEMY ENGINE</h1>
    <div id="who" class="text-xs text-slate-400"></div>
  </div>
</header>
<main id="app" class="max-w-5xl mx-auto px-4 py-6"></main>

<script>
const SUPABASE_URL = "https://ratnpbutyevultkjlfxw.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_15LGzTrmo_CmKNR3gbgHDQ_GUWwHLvP";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn = 'px-3 py-1.5 rounded-lg bg-amber-500 text-slate-950 font-semibold text-sm hover:bg-amber-400';
const btn2 = 'px-3 py-1.5 rounded-lg border border-slate-700 text-slate-300 text-sm hover:border-amber-500';
const inp = 'bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm w-full focus:outline-none focus:border-amber-500';
const card = 'bg-slate-900/60 border border-slate-800 rounded-2xl p-4';
const render = h => { $('#app').innerHTML = h; };
const fail = e => alert(e && e.message ? e.message : e);
let sb, ING = [], EFF = {}, P = null, creds = null, dm = {};

if (SUPABASE_URL.startsWith('PASTE')) {
  render(`<div class="${card}">Open <code>index.html</code> and paste your Supabase URL and anon key.</div>`);
} else {
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  boot();
}

async function boot() {
  const { data } = await sb.auth.getSession();
  if (data.session) return dmHome();
  try { const c = JSON.parse(sessionStorage.getItem('pc')); if (c) { creds = c; return playerRefresh(); } } catch (e) {}
  loginView('player');
}

// ================= LOGIN =================
function loginView(tab) {
  const tabBtn = (t, l) => `<button onclick="loginView('${t}')" class="${t===tab?btn:btn2} flex-1">${l}</button>`;
  render(`<div class="${card} max-w-sm mx-auto space-y-3">
    <div class="flex gap-2">${tabBtn('player','Player')}${tabBtn('dm','Dungeon Master')}</div>
    ${tab==='player' ? `
      <input id="u" class="${inp}" placeholder="Username" autocomplete="username">
      <input id="p" type="password" class="${inp}" placeholder="Campaign password" autocomplete="current-password">
      <button onclick="playerLogin()" class="${btn} w-full">Enter Laboratory</button>` : `
      <input id="e" type="email" class="${inp}" placeholder="DM email">
      <input id="p" type="password" class="${inp}" placeholder="Password">
      <div class="flex gap-2"><button onclick="dmLogin()" class="${btn} flex-1">Sign in</button><button onclick="dmSignup()" class="${btn2} flex-1">Create DM account</button></div>`}
  </div>`);
}
async function dmLogin() { const { error } = await sb.auth.signInWithPassword({ email: $('#e').value, password: $('#p').value }); error ? fail(error) : dmHome(); }
async function dmSignup() { const { error } = await sb.auth.signUp({ email: $('#e').value, password: $('#p').value }); error ? fail(error) : alert('Account created.'); }
async function logout() { if (!creds) await sb.auth.signOut(); sessionStorage.removeItem('pc'); creds = null; $('#who').textContent = ''; loginView('player'); }

// ================= DM SIDE =================
async function dmHome(tab) {
  $('#who').innerHTML = `DM <button onclick="logout()" class="ml-2 underline">Log out</button>`;
  if (!ING.length) {
    const { data } = await sb.from('ingredients').select('id,data');
    ING = data.map(r => r.data).sort((a,b) => a.name.localeCompare(b.name));
    const ef = await sb.from('effects').select('trait,data');
    EFF = Object.fromEntries((ef.data || []).map(r => [r.trait, r.data]));
  }
  const tabs = `<div class="flex gap-2 mb-5">
    <button onclick="dmHome()" class="${!tab ? btn : btn2}">Campaigns</button>
    <button onclick="dmHome('potions')" class="${tab === 'potions' ? btn : btn2}">Potion Index</button>
    <button onclick="dmHome('reagents')" class="${tab === 'reagents' ? btn : btn2}">Reagents Manager</button>
  </div>`;
  if (tab === 'potions') { render(tabs + '<div id="pv"></div>'); return potionsPanel($('#pv'), dmIndex(), 'No brewable potions.', true); }
  if (tab === 'reagents') { return dmReagentsPanel(tabs); }

  const { data: cs } = await sb.from('campaigns').select('id,name').order('created_at');
  render(tabs + `<h2 class="text-xl text-amber-200 mb-3">Your Campaigns (${cs.length}/5)</h2>
    <div class="grid sm:grid-cols-2 gap-3 mb-6">${cs.map(c => `<button onclick="openCampaign('${c.id}')" class="${card} text-left hover:border-amber-500"><i class="fa-solid fa-book-skull text-amber-400 mr-2"></i>${esc(c.name)}</button>`).join('')}</div>
    ${cs.length < 5 ? `<div class="${card} max-w-md space-y-2"><h3 class="text-sm text-amber-300">New Campaign</h3>
      <input id="cn" class="${inp}" placeholder="Campaign name"><input id="cp" class="${inp}" placeholder="Password (6+ chars)">
      <button onclick="newCampaign()" class="${btn}">Create</button></div>` : ''}`);
}

async function openCampaign(id, subView = 'main') {
  dm.cid = id;
  const [{ data: c }, { data: ps }, { data: logs }] = await Promise.all([
    sb.from('campaigns').select('id, name, password').eq('id', id).single(),
    sb.from('players').select('*').eq('campaign_id', id).order('username'),
    sb.from('activity_logs').select('*').eq('campaign_id', id).order('created_at', { ascending: false })
  ]);
  dm.cData = c;

  const topBar = `<button onclick="dmHome()" class="${btn2} mb-3"><i class="fa-solid fa-arrow-left"></i> Campaigns</button>
    <div class="flex justify-between items-center mb-3">
      <h2 class="text-xl text-amber-200">${esc(c.name)}</h2>
      <button onclick="downloadBackup()" class="${btn2} text-xs"><i class="fa-solid fa-download mr-1"></i> Download JSON Backup</button>
    </div>`;

  const tabs = `<div class="flex gap-2 mb-4">
    <button onclick="openCampaign('${id}', 'main')" class="${subView === 'main' ? btn : btn2}">Campaign Overview</button>
    <button onclick="openCampaign('${id}', 'logs')" class="${subView === 'logs' ? btn : btn2}"><i class="fa-solid fa-scroll mr-1"></i> Activity Log (${(logs || []).length})</button>
  </div>`;

  if (subView === 'logs') {
    render(topBar + tabs + `<div class="${card} space-y-2 max-h-[600px] overflow-y-auto">
      <h3 class="text-sm font-bold text-amber-300 border-b border-slate-800 pb-2">Campaign Activity Log</h3>
      ${(logs && logs.length) ? logs.map(l => `<div class="p-2.5 rounded-lg border border-slate-800 bg-slate-950/60 text-xs flex justify-between items-start gap-3">
        <div><span class="font-bold text-amber-200 mr-2">${esc(l.username)}</span><span class="px-1.5 py-0.5 rounded text-[10px] uppercase font-semibold bg-slate-800 text-slate-300">${esc(l.action)}</span><p class="text-slate-300 mt-1">${esc(l.details)}</p></div>
        <span class="text-[10px] text-slate-500 whitespace-nowrap">${new Date(l.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
      </div>`).join('') : '<p class="text-xs text-slate-500">No activity logged yet.</p>'}
    </div>`);
    return;
  }

  const last3 = ING.slice(-3);

  render(topBar + tabs + `
    <div class="${card} mb-4 space-y-3">
      <div class="flex justify-between items-center border-b border-slate-800 pb-2">
        <h3 class="text-sm font-bold text-amber-300"><i class="fa-solid fa-users mr-2"></i>Active Players (${ps.length})</h3>
        <button onclick="$('#add_p_box').classList.toggle('hidden')" class="${btn2} text-xs"><i class="fa-solid fa-user-plus mr-1"></i> Add Player</button>
      </div>
      <div id="add_p_box" class="hidden bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-2">
        <h4 class="text-xs font-semibold text-slate-300">Create New Player Profile</h4>
        <div class="flex gap-2"><input id="pn" class="${inp}" placeholder="Player username"><button onclick="addPlayer()" class="${btn}">Add</button></div>
      </div>
      <div class="grid sm:grid-cols-3 gap-3">
        ${ps.map(p => `<button onclick="openPlayer('${p.id}')" class="p-3 bg-slate-950 rounded-xl border border-slate-800 text-left hover:border-amber-500 flex justify-between items-center">
          <div><div class="font-bold text-amber-200 text-sm">${esc(p.username)}</div><div class="text-[10px] text-slate-500">Skill: ${esc(p.foraging_skill \vert{}\vert{} 'nature')} (+${p.foraging_bonus || 0})</div></div>
          <i class="fa-solid fa-chevron-right text-slate-600 text-xs"></i>
        </button>`).join('')}
      </div>
    </div>
  `);
}

// ================= PLAYER SIDE =================
async function playerLogin() { creds = { u: $('#u').value.trim(), p: $('#p').value }; await playerRefresh(true); }
async function playerRefresh(fromLogin) {
  const { data, error } = await sb.rpc('p_state', { uname: creds.u, pass: creds.p });
  if (error) return fail(error);
  if (!data) return loginView('player');
  try { sessionStorage.setItem('pc', JSON.stringify(creds)); } catch (e) {}
  P = data; $('#who').innerHTML = `${esc(P.username)} · ${esc(P.campaign)} <button onclick="logout()" class="ml-2 underline">Log out</button>`;
  playerView(window.ptab || 'lib');
}

function playerView(tab) {
  window.ptab = tab;
  const t = (k, l) => `<button onclick="playerView('${k}')" class="${tab === k ? btn : btn2}">${l}</button>`;
  render(`<div class="flex items-center justify-between mb-5">
    <div class="flex gap-2">${t('brew', 'Brewing Station')}${t('lib', 'My Reagents')}${t('pot', 'Potions')}</div>
    <div>${t('options', 'Options')}</div>
  </div><div id="pv"></div>`);
  tab === 'lib' ? libView() : tab === 'options' ? optionsView() : tab === 'pot' ? potView() : brewView();
}

function optionsView() {
  const skill = P.foraging_skill || 'nature';
  const bonus = P.foraging_bonus || 0;
  $('#pv').innerHTML = `<div class="${card} max-w-md mx-auto space-y-4">
    <h3 class="text-lg text-amber-200 font-bold"><i class="fa-solid fa-gear mr-2"></i>Character Options & Skill Settings</h3>
    <div>
      <label class="text-xs text-slate-400">Character Name</label>
      <input id="opt_name" class="${inp} mt-1" value="${esc(P.username)}">
    </div>
    <div>
      <label class="text-xs text-slate-400">Foraging Modifier Skill</label>
      <div class="flex gap-2 mt-1">
        <label class="flex-1 bg-slate-950 border border-slate-800 p-2 rounded-lg flex items-center gap-2 text-xs cursor-pointer">
          <input type="radio" name="f_skill" value="nature" ${skill==='nature'?'checked':''}> Nature / Int
        </label>
        <label class="flex-1 bg-slate-950 border border-slate-800 p-2 rounded-lg flex items-center gap-2 text-xs cursor-pointer">
          <input type="radio" name="f_skill" value="survival" ${skill==='survival'?'checked':''}> Survival / Wis
        </label>
        <label class="flex-1 bg-slate-950 border border-slate-800 p-2 rounded-lg flex items-center gap-2 text-xs cursor-pointer">
          <input type="radio" name="f_skill" value="perception" ${skill==='perception'?'checked':''}> Perception
        </label>
      </div>
    </div>
    <div>
      <label class="text-xs text-slate-400">Current Bonus Numerical Value (+Modifier)</label>
      <input id="opt_bonus" type="number" class="${inp} mt-1" value="${bonus}">
    </div>
    <button onclick="saveOptions()" class="${btn} w-full">Save Options</button>
  </div>`;
}

async function saveOptions() {
  const name = $('#opt_name').value.trim();
  const skill = document.querySelector('input[name="f_skill"]:checked').value;
  const bonus = parseInt($('#opt_bonus').value) || 0;
  
  const { error } = await sb.rpc('p_update_options', { uname: creds.u, pass: creds.p, new_name: name, f_skill: skill, f_bonus: bonus });
  if (error) return fail(error);
  creds.u = name;
  await playerRefresh();
  alert('Options updated!');
}

function libView() {
  const biomes = [...new Set(P.ingredients.map(i => i.biome).filter(Boolean))];
  $('#pv').innerHTML = `<div class="mb-3 flex gap-2">
    <select id="p_bio" class="${inp}" onchange="drawPlayerLib()"><option value="">All Biomes</option>${biomes.map(b=>`<option value="${esc(b)}">${esc(b)}</option>`).join('')}</select>
  </div><div id="p_lib_list" class="grid md:grid-cols-2 gap-3"></div>`;
  drawPlayerLib();
}

function drawPlayerLib() {
  const b = $('#p_bio').value;
  const filtered = P.ingredients.filter(i => !b || i.biome === b);
  $('#p_lib_list').innerHTML = filtered.map(i => `<div class="${card} relative">
    <div class="font-semibold text-amber-200 flex justify-between items-start">
      <span><i class="fa-solid ${esc(i.icon)} mr-2"></i>${esc(i.name)}</span>
      <button onclick="editQtyPrompt('${i.id}', ${i.qty || 0})" class="text-xs text-emerald-400 hover:underline font-bold">
        (Click to edit) In Stock: ${i.qty || 0}
      </button>
    </div>
    <div class="text-xs text-slate-400 mb-2">${esc(i.biome)} — ${esc(i.location)}</div>
    ${i.traits.map(t => t.name ? `<div class="text-sm"><span class="text-amber-300">${t.i + 1}.${esc(t.name)}</span> <span class="text-slate-400">${esc(t.desc)}</span></div>` : `<div class="text-sm text-slate-600">${t.i + 1}. ???</div>`).join('')}
    
    <div class="mt-3 pt-3 border-t border-slate-800/80 flex gap-2">
      ${!i.traits[0].name ? `<button onclick="doTasteTest('${i.id}')" class="${btn2} text-xs flex-1"><i class="fa-solid fa-vial mr-1"></i> Taste Test</button>` : ''}
      <button onclick="forageInteractive('${i.id}')" class="${btn} text-xs flex-1"><i class="fa-solid fa-seedling mr-1"></i> Forage For More</button>
    </div>
  </div>`).join('');
}

async function editQtyPrompt(iid, curQty) {
  const val = prompt("Set custom inventory quantity for this ingredient:", curQty);
  if (val === null) return;
  const newQty = parseInt(val);
  if (isNaN(newQty)) return;
  
  const { error } = await sb.rpc('p_set_qty', { uname: creds.u, pass: creds.p, iid, new_qty: newQty });
  if (error) return fail(error);
  await playerRefresh();
}

function forageInteractive(iid) {
  const ing = P.ingredients.find(x => x.id === iid);
  const skill = P.foraging_skill || 'nature';
  const bonus = P.foraging_bonus || 0;

  render(`<div class="${card} max-w-md mx-auto text-center space-y-4">
    <h3 class="text-lg text-amber-200 font-bold"><i class="fa-solid fa-magnifying-glass-location mr-2"></i>Foraging: ${esc(ing.name)}</h3>
    <p class="text-xs text-slate-400">Bonus applied: <strong>+${bonus}</strong> (${esc(skill.toUpperCase())})</p>
    
    <div id="dice_box" class="py-6">
      <div id="d20_icon" class="text-5xl text-amber-400"><i class="fa-solid fa-dice-d20"></i></div>
      <div id="roll_status" class="text-sm font-bold mt-2 text-slate-300">Ready to roll search check...</div>
    </div>

    <div id="act_btns">
      <button onclick="runForageD20('${iid}')" class="${btn} w-full"><i class="fa-solid fa-dice mr-1"></i> Roll D20 Search Check</button>
    </div>
  </div>`);
}

async function runForageD20(iid) {
  $('#d20_icon').classList.add('animate-dice');
  $('#roll_status').textContent = "Searching through foliage...";
  $('#act_btns').innerHTML = '';

  setTimeout(async () => {
    $('#d20_icon').classList.remove('animate-dice');
    const d20 = Math.floor(Math.random() * 20) + 1;
    const ing = P.ingredients.find(x => x.id === iid);
    const bonus = P.foraging_bonus || 0;
    const total = d20 + bonus;

    let reqDc = 8;
    const rarity = (ing.rarity || 'common').toLowerCase();
    if (rarity === 'uncommon') reqDc = 12;
    if (rarity === 'rare') reqDc = 14;
    if (rarity === 'extremely rare' || rarity === 'ext-rare') reqDc = 16;
    if (P.master) reqDc = reqDc - 4;

    const pass = total >= reqDc;

    if (!pass) {
      // Record failure
      await sb.rpc('p_forage_harvest', { uname: creds.u, pass: creds.p, iid, d20_roll: d20, d4_yield: 0 });
      $('#roll_status').innerHTML = `<span class="text-red-400 font-bold">Rolled ${d20} + ${bonus} = ${total} (DC ${reqDc})</span><br><span class="text-xs text-slate-400">Search unsuccessful. No ingredients found.</span>`;
      $('#act_btns').innerHTML = `<button onclick="playerView('lib')" class="${btn2} w-full mt-3">Back to Reagents</button>`;
    } else {
      $('#roll_status').innerHTML = `<span class="text-emerald-400 font-bold">SUCCESS! Rolled ${d20} + ${bonus} = ${total} (DC ${reqDc})</span>`;
      
      // Step 2: Prompt for Quantity Roll
      $('#act_btns').innerHTML = `
        <div id="d4_box" class="my-4">
          <div id="d4_icon" class="text-4xl text-amber-400"><i class="fa-solid fa-dice-d4"></i></div>
          <div id="d4_status" class="text-xs text-amber-200 mt-1">Roll for harvest yield (1d4)...</div>
        </div>
        <button onclick="runForageD4('${iid}', ${d20})" class="${btn} w-full">Roll For Quantity (1d4)</button>
      `;
    }
  }, 700);
}

async function runForageD4(iid, originalD20) {
  $('#d4_icon').classList.add('animate-dice');
  $('#d4_status').textContent = "Harvesting plants...";

  setTimeout(async () => {
    $('#d4_icon').classList.remove('animate-dice');
    const d4 = Math.floor(Math.random() * 4) + 1;
    
    await sb.rpc('p_forage_harvest', { uname: creds.u, pass: creds.p, iid, d20_roll: originalD20, d4_yield: d4 });
    await playerRefresh();

    $('#d4_status').innerHTML = `<span class="text-emerald-300 font-bold text-base">Harvested +${d4} units!</span>`;
    $('#act_btns').innerHTML = `<button onclick="playerView('lib')" class="${btn} w-full mt-3">Back to Reagents</button>`;
  }, 600);
}

function doTasteTest(iid) {
  render(`<div class="${card} max-w-md mx-auto text-center space-y-4">
    <h3 class="text-lg text-amber-200 font-bold">Taste Testing Reagent</h3>
    <p class="text-xs text-slate-400">Notice: This roll ignores all Constitution modifiers and bonuses. Standard DC 10.</p>
    <div id="dice_anim" class="text-4xl text-amber-400 py-4"><i class="fa-solid fa-dice-d20"></i></div>
    <button onclick="rollTaste('${iid}')" class="${btn}">Roll Taste Check</button>
  </div>`);
}

async function rollTaste(iid) {
  $('#dice_anim').classList.add('animate-dice');
  setTimeout(async () => {
    const rawRoll = Math.floor(Math.random() * 20) + 1;
    const { data } = await sb.rpc('p_taste_test', { uname: creds.u, pass: creds.p, iid, raw_d20_roll: rawRoll });
    const { data: s } = await sb.rpc('p_state', { uname: creds.u, pass: creds.p }); if (s) P = s;
    render(`<div class="${card} max-w-md mx-auto text-center space-y-3">
      <h3 class="text-xl ${data.success ? 'text-emerald-300' : 'text-red-400'} font-bold">Rolled ${rawRoll} vs DC 10</h3>
      <p class="text-sm">${data.success ? `Success! Learned Trait 1: <strong class="text-amber-300">${esc(data.trait)}</strong>` : `Failed Save! ${esc(data.effect)}`}</p>
      <button onclick="playerView('lib')" class="${btn}">Back to Reagents</button>
    </div>`);
  }, 600);
}

function brewView() {
  const opts = P.ingredients.filter(i => (i.qty || 0) > 0).map(i => `<option value="${esc(i.id)}">${esc(i.name)} (${i.qty} in stock)</option>`).join('');
  $('#pv').innerHTML = !opts ? `<p class="text-slate-500">You have no ingredients in stock. Ask your DM or go foraging!</p>` : `<div class="${card} space-y-3">
    <div class="grid sm:grid-cols-2 gap-3"><div><label class="text-xs text-slate-400">Reagent #1</label><select id="i1" class="${inp}">${opts}</select></div>
    <div><label class="text-xs text-slate-400">Reagent #2</label><select id="i2" class="${inp}">${opts}</select></div></div>
    <div><label class="text-xs text-slate-400">Solvent</label><select id="sv" class="${inp}"><option value="1">Level 1: Impure Water</option><option value="2">Level 2: Pure Water</option><option value="3">Level 3: Pristine Water</option></select></div>
    <button onclick="brew()" class="${btn}"><i class="fa-solid fa-mortar-pestle mr-1"></i> Brew Potion</button></div><div id="res" class="mt-4"></div>`;
}

async function brew() {
  const sv = +$('#sv').value;
  const { data, error } = await sb.rpc('p_brew', { uname: creds.u, pass: creds.p, ing1: $('#i1').value, ing2: $('#i2').value, solvent: sv, idx1: 0, idx2: 0 });
  if (error) return fail(error);
  const { data: s } = await sb.rpc('p_state', { uname: creds.u, pass: creds.p }); if (s) P = s;
  brewView();
  $('#res').innerHTML = data.ok ? `<div class="p-4 border border-emerald-500 bg-emerald-950/40 rounded-xl">Success! Brewed ${esc(data.trait)}. 1 unit deducted from both reagents.</div>`
    : `<div class="p-4 border border-red-500 bg-red-950/40 rounded-xl">Mismatch! Produced Foul Sludge. 1 unit deducted from both reagents.</div>`;
}
</script>
</body>
</html>
